<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music Birthday CELEBRATION</title>
    <style>
        :root {
            --bg-color: #02000a;
            --accent-color: #ff007f;
            --sub-color: #00d2ff;
            --fever-color: #ffea00;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            color: white; font-family: sans-serif;
            user-select: none; -webkit-user-select: none; touch-action: none;
            transition: background-color 0.5s;
        }

        /* --- フィーバー時の明るい背景 --- */
        body.fever-active {
            background-color: #330033;
            animation: bg-flash 0.5s infinite alternate;
        }
        @keyframes bg-flash {
            from { background-color: #440044; }
            to { background-color: #660066; }
        }

        /* --- UIバー --- */
        #ui {
            position: absolute; top: 0; width: 100%; z-index: 100;
            padding-top: env(safe-area-inset-top);
            background: rgba(0,0,0,0.85); pointer-events: none; border-bottom: 2px solid #333;
        }
        #top-collection { display: flex; justify-content: center; gap: 10px; padding: 4px 0; }
        .top-item { font-size: 20px; opacity: 0.15; transition: 0.5s; }
        .top-item.active { opacity: 1; filter: drop-shadow(0 0 8px white); transform: scale(1.1); }

        #score-panel { display: flex; justify-content: center; align-items: baseline; gap: 25px; padding: 8px 0; }
        .score-num { font-size: 24px; font-weight: bold; }
        #timer-display { text-align: center; padding-bottom: 5px; font-size: 14px; }

        #fever-bar { width: 100%; height: 8px; background: #222; }
        #fever-fill { width: 0%; height: 100%; background: var(--fever-color); transition: width 0.1s linear; box-shadow: 0 0 15px var(--fever-color); }

        /* --- ゲーム要素 --- */
        .note { position: absolute; font-size: 55px; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; z-index: 10; filter: drop-shadow(0 0 12px currentColor); }
        .particle { position: absolute; pointer-events: none; z-index: 100; border-radius: 50%; animation: p-fade forwards ease-out; }
        @keyframes p-fade { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

        #title-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #msg-card { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; background: white; color: #333; padding: 25px; border-radius: 20px; z-index: 2000; text-align: center; box-shadow: 0 0 50px var(--accent-color); }
        button { background: var(--accent-color); color: white; border: none; padding: 15px 40px; border-radius: 40px; font-size: 20px; font-weight: bold; box-shadow: 0 4px 0 #b00058; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="top-collection">
            <span class="top-item" id="t-🎸">🎸</span><span class="top-item" id="t-🎹">🎹</span>
            <span class="top-item" id="t-🥁">🥁</span><span class="top-item" id="t-🎤">🎤</span><span class="top-item" id="t-🎷">🎷</span>
        </div>
        <div id="score-panel">
            <div style="text-align:center;"><span style="font-size:9px; color:var(--sub-color);">BEST</span><br><span id="hi-score" class="score-num">--.--</span></div>
            <div style="text-align:center;"><span style="font-size:9px; color:var(--sub-color);">COUNT</span><br><span id="cur-count" class="score-num">0 / 40</span></div>
        </div>
        <div id="timer-display">TIME: <span id="timer-val" style="color:var(--accent-color); font-weight:bold;">0.00</span>s</div>
        <div id="fever-bar"><div id="fever-fill"></div></div>
    </div>

    <div id="title-screen">
        <h1 style="color:var(--accent-color); font-size:32px;">Music Birthday!</h1>
        <p>音符を40個集めて楽器をコンプリートしよう！</p>
        <button onclick="start()">START!</button>
    </div>

    <div id="play-area" style="width:100%; height:100%;"></div>

    <div id="msg-card">
        <h2 id="result-title">Finish!</h2>
        <div id="get-item" style="font-size:70px; margin:10px 0;">🎸</div>
        <p id="item-msg" style="font-weight:bold; color:var(--accent-color);"></p>
        <p id="result-time-text" style="font-family:monospace; font-size:20px;"></p>
        <button onclick="location.reload()">NEXT STAGE</button>
    </div>
</div>

<script>
    const GOAL = 40;
    const ITEMS = ['🎸', '🎹', '🥁', '🎤', '🎷'];
    const MESSAGES = {
        '🎸': '情熱的なギター！', '🎹': '気品あるピアノ！', '🥁': 'パワフルなドラム！', 
        '🎤': '輝くマイク！', '🎷': '響きわたるサックス！'
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let score = 0, fever = 0, isFever = false, gameState = 'title', notes = [];
    let startTime, timerInterval;
    
    let bestTime = localStorage.getItem('bd_best_v11') || 99.99;
    let collection = JSON.parse(localStorage.getItem('bd_col_v11')) || [];

    document.getElementById('hi-score').innerText = parseFloat(bestTime).toFixed(2);
    updateCollectionUI();

    function playNote(freq, type, duration, vol=0.1) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + duration);
    }

    // 豪華なリザルト音（和音）
    function playFanfare(isRecord) {
        const chords = isRecord ? [523.25, 659.25, 783.99, 1046.50] : [261.63, 329.63, 392.00, 523.25];
        chords.forEach((f, i) => {
            setTimeout(() => playNote(f, 'triangle', 0.8, 0.15), i * 100);
        });
    }

    function start() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        gameState = 'play'; score = 0; fever = 0;
        document.getElementById('title-screen').style.display = 'none';
        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            document.getElementById('timer-val').innerText = elapsed.toFixed(2);
        }, 50);
        resupply();
        gameLoop();
    }

    class Note {
        constructor(fMode) {
            this.fever = fMode;
            this.fake = !this.fever && Math.random() < 0.25;
            this.el = document.createElement('div');
            this.el.className = 'note';
            if(this.fake) { this.el.innerText = '💀'; this.el.style.color = '#444'; }
            else if(this.fever) { this.el.innerText = '🎁'; this.el.style.color = 'gold'; }
            else { this.el.innerText = ['♪','♫','♬'][Math.floor(Math.random()*3)]; this.el.style.color = `hsl(${Math.random()*360},90%,75%)`; }
            this.x = Math.random()*(window.innerWidth-80);
            this.y = Math.random()*(window.innerHeight-280)+180;
            let s = (this.fever ? 7 : 4.5) + (score*0.06);
            let a = Math.random()*Math.PI*2;
            this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s;
            document.getElementById('play-area').appendChild(this.el);
            this.el.addEventListener('touchstart', (e)=>{ e.preventDefault(); this.tap(); });
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if(this.x<0 || this.x>window.innerWidth-80) this.vx*=-1;
            if(this.y<180 || this.y>window.innerHeight-80) this.vy*=-1;
            this.el.style.transform = `translate(${this.x}px, ${this.y}px)`;
        }
        tap() {
            if(this.fake) {
                playNote(100, 'sawtooth', 0.4, 0.2); score = Math.max(0, score-3); fever = 0;
            } else {
                playNote(this.fever?900:600, 'sine', 0.1);
                score += 1;
                if(!this.fever) { fever += 15; if(fever>=100) activateFever(); }
            }
            this.el.remove(); notes = notes.filter(n=>n!==this);
            updateUI();
            resupply();
            if(score >= GOAL && !isFever) showResult();
        }
    }

    function resupply() {
        if(gameState !== 'play') return;
        const target = isFever ? 25 : 12;
        while(notes.length < target) notes.push(new Note(isFever));
    }

    function activateFever() {
        isFever = true; fever = 100;
        document.body.classList.add('fever-active');
        playNote(880, 'square', 0.5);
        notes.forEach(n => { if(n.fake) n.el.remove(); });
        notes = notes.filter(n => !n.fake);
        setTimeout(() => {
            isFever = false; fever = 0;
            document.body.classList.remove('fever-active');
            notes.forEach(n => n.el.remove());
            notes = [];
            updateUI();
            resupply();
        }, 7000);
    }

    function updateUI() {
        document.getElementById('cur-count').innerText = `${score} / ${GOAL}`;
        document.getElementById('fever-fill').style.width = fever + '%';
    }

    function updateCollectionUI() {
        ITEMS.forEach(item => { if (collection.includes(item)) document.getElementById(`t-${item}`).classList.add('active'); });
    }

    function showResult() {
        clearInterval(timerInterval);
        gameState = 'ending';
        const finalTime = (Date.now() - startTime) / 1000;
        
        let uncollected = ITEMS.filter(i => !collection.includes(i));
        let got = uncollected.length > 0 ? uncollected[Math.floor(Math.random()*uncollected.length)] : ITEMS[Math.floor(Math.random()*ITEMS.length)];
        
        if(uncollected.length > 0) {
            collection.push(got);
            localStorage.setItem('bd_col_v11', JSON.stringify(collection));
        }

        document.getElementById('get-item').innerText = got;
        document.getElementById('item-msg').innerText = MESSAGES[got] + "ゲット！";
        document.getElementById('result-time-text').innerText = `TIME: ${finalTime.toFixed(2)}s`;

        let isRecord = false;
        if(finalTime < bestTime) {
            bestTime = finalTime;
            localStorage.setItem('bd_best_v11', bestTime);
            document.getElementById('result-title').innerText = "NEW RECORD!!";
            isRecord = true;
        }

        playFanfare(isRecord);
        document.getElementById('msg-card').style.display = 'block';
    }

    function gameLoop() {
        if(gameState === 'play') notes.forEach(n=>n.update());
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
