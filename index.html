<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music Birthday for KATCHAN</title>

    <meta property="og:title" content="Happy Birthday かっちゃん!">
    <meta property="og:description" content="音符を集めて楽器をコンプリートしよう！誕生日おめでとう！">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://Lanchangames.github.io/kasumihappybirthday/">
    <meta property="og:image" content="https://raw.githubusercontent.com/Lanchangames/kasumihappybirthday/main/image.png">

    <style>
        :root {
            --bg-color: #02000a;
            --accent-color: #ff007f;
            --sub-color: #00d2ff;
            --fever-color: #ffea00;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            color: white; font-family: sans-serif;
            user-select: none; -webkit-user-select: none; touch-action: none;
            transition: background-color 0.5s;
        }

        body.fever-active { background-color: #330033; animation: bg-flash 0.5s infinite alternate; }
        @keyframes bg-flash { from { background-color: #440044; } to { background-color: #660066; } }

        /* --- UIバー --- */
        #ui { position: absolute; top: 0; width: 100%; z-index: 100; padding-top: env(safe-area-inset-top); background: rgba(0,0,0,0.85); pointer-events: none; border-bottom: 2px solid #333; }
        #top-collection { display: flex; justify-content: center; gap: 10px; padding: 4px 0; }
        .top-item { font-size: 20px; opacity: 0.15; transition: 0.5s; }
        .top-item.active { opacity: 1; filter: drop-shadow(0 0 8px white); transform: scale(1.1); }
        #score-panel { display: flex; justify-content: center; align-items: baseline; gap: 25px; padding: 8px 0; }
        .score-num { font-size: 24px; font-weight: bold; }
        #timer-display { text-align: center; padding-bottom: 5px; font-size: 14px; }
        #fever-bar { width: 100%; height: 8px; background: #222; }
        #fever-fill { width: 0%; height: 100%; background: var(--fever-color); transition: width 0.1s linear; box-shadow: 0 0 15px var(--fever-color); }

        /* --- ゲーム要素 --- */
        .note { position: absolute; font-size: 55px; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; z-index: 10; filter: drop-shadow(0 0 12px currentColor); }

        /* --- モーダル --- */
        .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #msg-card { 
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 85%; background: white; color: #333; padding: 20px; border-radius: 20px; 
            z-index: 2000; text-align: center; box-shadow: 0 0 50px var(--accent-color); 
            max-height: 80vh; overflow-y: auto;
        }
        
        /* --- コレクション画面 --- */
        #collection-screen { display: none; background: #111; z-index: 3000; overflow-y: auto; flex-direction: column; align-items: center; padding-top: 60px; }
        .col-list { width: 90%; display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .col-item { background: #222; border-radius: 15px; padding: 15px; display: flex; align-items: center; gap: 15px; text-align: left; border: 1px solid #444; }
        .col-icon { font-size: 40px; }
        .col-text { font-size: 12px; line-height: 1.4; color: #ccc; }
        .locked { opacity: 0.3; filter: grayscale(1); }

        button { background: var(--accent-color); color: white; border: none; padding: 12px 30px; border-radius: 40px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-sub { background: #444; font-size: 14px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="top-collection">
            <span class="top-item" id="t-🎸">🎸</span><span class="top-item" id="t-🎹">🎹</span>
            <span class="top-item" id="t-🥁">🥁</span><span class="top-item" id="t-🎤">🎤</span><span class="top-item" id="t-🎷">🎷</span>
        </div>
        <div id="score-panel">
            <div style="text-align:center;"><span style="font-size:9px; color:var(--sub-color);">BEST TIME</span><br><span id="hi-score" class="score-num">--.--</span></div>
            <div style="text-align:center;"><span style="font-size:9px; color:var(--sub-color);">COUNT</span><br><span id="cur-count" class="score-num">0 / 50</span></div>
        </div>
        <div id="timer-display">TIME: <span id="timer-val" style="color:var(--accent-color); font-weight:bold;">0.00</span>s</div>
        <div id="fever-bar"><div id="fever-fill"></div></div>
    </div>

    <div id="title-screen" class="modal">
        <h1 style="color:var(--accent-color); font-size:32px; margin-bottom:5px;">Music Birthday!</h1>
        <p>かっちゃん、お誕生日おめでとう！</p>
        <button onclick="start()">GAME START</button>
        <button class="btn-sub" onclick="openCollection()">COLLECTION</button>
    </div>

    <div id="collection-screen" class="modal">
        <h2 style="color:var(--sub-color);">COLLECTION</h2>
        <div id="col-container" class="col-list"></div>
        <div id="complete-area" style="display:none; padding:15px; background:#303; border-radius:15px; margin-bottom:20px; width:85%; font-size:13px;"></div>
        <button onclick="closeCollection()">BACK</button>
    </div>

    <div id="play-area" style="width:100%; height:100%;"></div>

    <div id="msg-card">
        <h2 id="result-title" style="margin: 5px 0;">Finish!</h2>
        <div id="get-item" style="font-size:60px; margin:5px 0;">🎸</div>
        <p id="item-msg" style="font-size: 14px; line-height: 1.6; color: #444; margin-bottom: 10px;"></p>
        <p id="result-time-text" style="font-family:monospace; font-weight: bold; font-size:18px; margin: 5px 0;"></p>
        <button id="res-btn" onclick="handleResultButton()">NEXT</button>
    </div>
</div>

<script>
    const GOAL = 50;
    const ITEMS = ['🎸', '🎹', '🥁', '🎤', '🎷'];
    const MESSAGES = {
        '🎸': '【情熱のギター】をゲット！<br>自分の好きなことに真っ直ぐ突き進む1年になりますように！かっちゃんのチャレンジの成功を祈ります！',
        '🎹': '【気品あるピアノ】をゲット！<br>どんな時も自分らしく楽しくすごそうね！いつもおしゃれなかっちゃんが大好き！',
        '🥁': '【パワフルなドラム】をゲット！<br>エネルギッシュな1年を過ごしてね！いつも遊んでくれてありがとう、今年も沢山遊んでね',
        '🎤': '【輝く黄金マイク】をゲット！<br>年末のフェスも競馬も楽しかったです。また一緒に行ってくれると嬉しいな',
        '🎷': '【響きわたるサックス】をゲット！<br>魅力あふれる1年になりますように！メリポ楽しみすぎです！最高の思い出をたくさん作っていこうね！'
    };
    const COMPLETE_MSG = "★ ALL COMPLETE ★<br>すべての楽器が揃ったよ！おめでとう！<br>かっちゃんの周りにはいつも素敵な音楽と笑顔が溢れています。この1年が、今までにないくらいハッピーな毎日になりますように！いつも応援しているよ。お誕生日おめでとう！";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let score = 0, fever = 0, isFever = false, gameState = 'title', notes = [];
    let startTime, timerInterval, currentGotItem = null, isFinalStep = false;
    
    let bestTime = localStorage.getItem('katchan_best_time') || 99.99;
    let collection = JSON.parse(localStorage.getItem('katchan_collection')) || [];

    document.getElementById('hi-score').innerText = parseFloat(bestTime).toFixed(2);
    updateCollectionUI();

    function playNote(freq, type, duration, vol=0.1) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + duration);
    }

    function start() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        gameState = 'play'; score = 0; fever = 0; isFinalStep = false;
        document.getElementById('title-screen').style.display = 'none';
        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            document.getElementById('timer-val').innerText = elapsed.toFixed(2);
        }, 50);
        resupply();
        gameLoop();
    }

    class Note {
        constructor(fMode) {
            this.fever = fMode;
            this.fake = !this.fever && Math.random() < 0.25;
            this.el = document.createElement('div');
            this.el.className = 'note';
            if(this.fake) { this.el.innerText = '💀'; this.el.style.color = '#444'; }
            else if(this.fever) { this.el.innerText = '🎁'; this.el.style.color = 'gold'; }
            else { this.el.innerText = ['♪','♫','♬'][Math.floor(Math.random()*3)]; this.el.style.color = `hsl(${Math.random()*360},90%,75%)`; }
            this.x = Math.random()*(window.innerWidth-80);
            this.y = Math.random()*(window.innerHeight-280)+180;
            let s = (this.fever ? 3.5 : 2.2) + (score * 0.02); 
            let a = Math.random()*Math.PI*2;
            this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s;
            document.getElementById('play-area').appendChild(this.el);
            this.el.addEventListener('touchstart', (e)=>{ e.preventDefault(); this.tap(); });
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if(this.x<0 || this.x>window.innerWidth-80) this.vx*=-1;
            if(this.y<180 || this.y>window.innerHeight-80) this.vy*=-1;
            this.el.style.transform = `translate(${this.x}px, ${this.y}px)`;
        }
        tap() {
            if (gameState !== 'play' && gameState !== 'fever') return;
            if(this.fake) { playNote(100, 'sawtooth', 0.4, 0.2); score = Math.max(0, score-3); fever = 0; }
            else { 
                playNote(this.fever?900:600, 'sine', 0.1); score += 1;
                if(!this.fever) { fever += 15; if(fever>=100) activateFever(); }
            }
            this.el.remove(); notes = notes.filter(n=>n!==this);
            updateUI(); resupply();
            if(score >= GOAL) showResult();
        }
    }

    function resupply() { if(gameState !== 'play' && gameState !== 'fever') return; const target = isFever ? 12 : 6; while(notes.length < target) notes.push(new Note(isFever)); }

    function activateFever() {
        if (gameState !== 'play') return;
        gameState = 'fever'; isFever = true; fever = 100;
        document.body.classList.add('fever-active');
        notes.forEach(n => { if(n.fake) n.el.remove(); }); notes = notes.filter(n => !n.fake);
        setTimeout(() => { 
            if (gameState !== 'fever') return;
            gameState = 'play'; isFever = false; fever = 0;
            document.body.classList.remove('fever-active');
            notes.forEach(n => n.el.remove()); notes = [];
            updateUI(); resupply();
        }, 5000);
    }

    function updateUI() { document.getElementById('cur-count').innerText = `${score} / ${GOAL}`; document.getElementById('fever-fill').style.width = fever + '%'; }

    function showResult() {
        if (gameState === 'ending') return;
        clearInterval(timerInterval);
        gameState = 'ending';
        const finalTime = (Date.now() - startTime) / 1000;
        
        let uncollected = ITEMS.filter(i => !collection.includes(i));
        currentGotItem = uncollected.length > 0 ? uncollected[Math.floor(Math.random()*uncollected.length)] : ITEMS[Math.floor(Math.random()*ITEMS.length)];
        
        if(uncollected.length > 0) {
            collection.push(currentGotItem);
            localStorage.setItem('katchan_collection', JSON.stringify(collection));
        }

        document.getElementById('get-item').innerText = currentGotItem;
        document.getElementById('item-msg').innerHTML = MESSAGES[currentGotItem];
        document.getElementById('result-time-text').innerText = `CLEAR TIME: ${finalTime.toFixed(2)}s`;

        let isRecord = false;
        if(finalTime < bestTime) {
            bestTime = finalTime; localStorage.setItem('katchan_best_time', bestTime);
            document.getElementById('result-title').innerText = "NEW RECORD!!"; isRecord = true;
        } else {
            document.getElementById('result-title').innerText = "Finish!";
        }

        isFinalStep = (collection.length === 5);
        document.getElementById('res-btn').innerText = isFinalStep ? "CHECK COMPLETE" : "BACK TO HOME";

        playNote(523, 'triangle', 0.5);
        notes.forEach(n => n.el.remove()); notes = [];
        document.getElementById('msg-card').style.display = 'block';
    }

    function handleResultButton() {
        if (isFinalStep) {
            document.getElementById('result-title').innerText = "HAPPY BIRTHDAY!!!";
            document.getElementById('get-item').innerText = "🎂";
            document.getElementById('item-msg').innerHTML = COMPLETE_MSG;
            document.getElementById('msg-card').style.boxShadow = "0 0 50px gold";
            document.getElementById('res-btn').innerText = "BACK TO HOME";
            isFinalStep = false;
            playNote(659, 'triangle', 1.0);
        } else {
            location.reload();
        }
    }

    function openCollection() {
        const container = document.getElementById('col-container');
        container.innerHTML = '';
        ITEMS.forEach(item => {
            const div = document.createElement('div');
            div.className = `col-item ${collection.includes(item) ? '' : 'locked'}`;
            div.innerHTML = `
                <div class="col-icon">${item}</div>
                <div class="col-text">${collection.includes(item) ? MESSAGES[item] : '???'}</div>
            `;
            container.appendChild(div);
        });
        if (collection.length === 5) {
            const area = document.getElementById('complete-area');
            area.style.display = 'block';
            area.innerHTML = `<strong>MESSAGE FROM SPECIAL</strong><br>${COMPLETE_MSG}`;
        }
        document.getElementById('collection-screen').style.display = 'flex';
    }

    function closeCollection() { document.getElementById('collection-screen').style.display = 'none'; }
    function updateCollectionUI() { ITEMS.forEach(item => { if (collection.includes(item)) document.getElementById(`t-${item}`).classList.add('active'); }); }
    function gameLoop() { if(gameState === 'play' || gameState === 'fever') notes.forEach(n=>n.update()); requestAnimationFrame(gameLoop); }
</script>
</body>
</html>
